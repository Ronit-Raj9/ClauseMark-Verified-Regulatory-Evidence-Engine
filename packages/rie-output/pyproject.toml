[project]
name = "rie-output"
version = "0.1.0"
description = "Conformance output writer — judge-validated 13-column CSV + JSON evidence package."
requires-python = ">=3.12,<3.13"
dependencies = ["rie-contracts", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rie_output"]
