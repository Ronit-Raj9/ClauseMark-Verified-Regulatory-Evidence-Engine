# Source registry — Malaysia (UN name: Malaysia). RDTII 2.1 Pillar 6 + 7 primary
# instruments. Authority tiers per rie-contracts AuthorityTier enum.
#
# CONTRACT GAP: the task asked for per-source `law_number_ref` and `last_amended`
# keys. The JSON schema (sources/_schema/source_registry.schema.json) now ALLOWS
# them, but the FROZEN rie-contracts `SourceRegistryEntry` model uses
# extra="forbid" and has no such fields, so ConfigRepository.load_source_registry
# would REJECT any entry that sets them. They are therefore NOT set on entries
# below; the law number is folded into `title` and the amendment context noted in
# comments. ESCALATED to lead (see report).
