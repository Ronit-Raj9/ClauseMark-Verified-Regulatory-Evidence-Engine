[project]
name = "rie-profiles"
version = "0.1.0"
description = "Document-profile strategies (statutory / tabular / mixed / treaty)."
requires-python = ">=3.12,<3.13"
dependencies = ["rie-contracts", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rie_profiles"]
