pillar_id: "5"
pillar_name: "Telecom and competition"
cluster: "other_domestic"
document_profile: "mixed_regulatory"
status: "built"
description: >
  Telecommunications market openness, independence of the telecom regulator,
  spectrum allocation transparency, and the competition-law framework as it
  applies to digital infrastructure markets.

indicators:
  - indicator_id: "5.1"
    name: "Independent telecom regulator"
    definition: >
      Whether an independent telecom regulator exists with rule-making and
      enforcement powers, structurally separate from operators and ministerial
      direction.
    evaluation_method: "clause_extraction"
    clause_pattern: "obligation"
    scoring_criteria:
      "0": "No independent regulator; functions held by ministry."
      "0.5": "Regulator exists but subject to direct ministerial control or operator influence."
      "1": "Independent regulator with rule-making and enforcement powers and budgetary autonomy."
    positive_keywords:
      en: ["independent regulator", "telecommunications authority", "shall be independent",
           "separate from operators", "regulatory commission"]
      fr: ["régulateur indépendant", "autorité de régulation des télécommunications", "est indépendant",
           "distinct des opérateurs", "commission de régulation"]
      es: ["regulador independiente", "autoridad de telecomunicaciones", "será independiente",
           "separado de los operadores", "comisión reguladora"]
      zh: ["独立监管机构", "电信管理局", "应当独立",
           "独立于运营商", "监管委员会"]
    negative_cues:
      en: ["under the direction of the Minister", "ministry shall regulate"]
      fr: ["sous la direction du Ministre", "le ministère réglemente"]
      es: ["bajo la dirección del Ministro", "el ministerio regulará"]
      zh: ["在部长的指导下", "由部委监管"]
    authority_hints: ["tier_1_statute"]

  - indicator_id: "5.2"
    name: "Spectrum allocation transparency"
    definition: >
      Whether spectrum allocation procedures are published in advance with
      competitive, non-discriminatory award mechanisms (auctions or beauty
      contests with published criteria).
    evaluation_method: "clause_extraction"
    clause_pattern: "obligation"
    scoring_criteria:
      "0": "Allocations discretionary and unpublished."
      "0.5": "Allocations published but criteria opaque or non-competitive."
      "1": "Competitive allocation with published criteria and timetable."
    positive_keywords:
      en: ["spectrum allocation", "auction", "published criteria", "non-discriminatory",
           "frequency allocation", "spectrum plan"]
      fr: ["attribution du spectre", "enchères", "critères publiés", "non discriminatoire",
           "attribution des fréquences", "plan de fréquences"]
      es: ["asignación del espectro", "subasta", "criterios publicados", "no discriminatorio",
           "asignación de frecuencias", "plan de frecuencias"]
      zh: ["频谱分配", "拍卖", "公布的标准", "非歧视性",
           "频率分配", "频谱规划"]
    authority_hints: ["tier_2_regulation", "tier_3_guideline"]

  - indicator_id: "5.3"
    name: "Competition law applicable to telecom / digital markets"
    definition: >
      Whether a general competition statute applies to telecom and digital
      markets, with prohibitions on abuse of dominance and anti-competitive
      agreements.
    evaluation_method: "clause_extraction"
    clause_pattern: "prohibition"
    scoring_criteria:
      "0": "No competition statute or telecom expressly excluded."
      "0.5": "Competition statute exists but with limited application to telecom."
      "1": "Competition statute applies with sector-specific ex-ante telecom rules."
    positive_keywords:
      en: ["abuse of dominance", "anti-competitive agreement", "competition act",
           "significant market power", "essential facility"]
      fr: ["abus de position dominante", "entente anticoncurrentielle", "loi sur la concurrence",
           "puissance significative sur le marché", "infrastructure essentielle"]
      es: ["abuso de posición dominante", "acuerdo anticompetitivo", "ley de competencia",
           "poder significativo de mercado", "instalación esencial"]
      zh: ["滥用市场支配地位", "反竞争协议", "竞争法",
           "重要市场支配力", "必要设施"]
    negative_cues:
      en: ["telecommunications sector is excluded", "shall not apply to telecom"]
      fr: ["le secteur des télécommunications est exclu", "ne s'applique pas aux télécommunications"]
      es: ["el sector de las telecomunicaciones queda excluido", "no se aplicará a las telecomunicaciones"]
      zh: ["电信部门除外", "不适用于电信"]
    authority_hints: ["tier_1_statute", "tier_2_regulation"]

  - indicator_id: "5.4"
    name: "Interconnection obligation"
    definition: >
      Whether operators with significant market power are required to provide
      interconnection on fair, reasonable and non-discriminatory terms.
    evaluation_method: "clause_extraction"
    clause_pattern: "obligation"
    scoring_criteria:
      "0": "No interconnection obligation."
      "0.5": "Interconnection obligation exists but pricing or terms not regulated."
      "1": "Interconnection obligation with cost-oriented, non-discriminatory pricing."
    positive_keywords:
      en: ["interconnection", "significant market power", "cost-oriented",
           "reference offer", "non-discriminatory terms"]
      fr: ["interconnexion", "puissance significative sur le marché", "orienté vers les coûts",
           "offre de référence", "conditions non discriminatoires"]
      es: ["interconexión", "poder significativo de mercado", "orientado a costos",
           "oferta de referencia", "condiciones no discriminatorias"]
      zh: ["互联互通", "重要市场支配力", "成本导向",
           "参考报价", "非歧视性条件"]
    authority_hints: ["tier_1_statute", "tier_2_regulation"]

  - indicator_id: "5.5"
    name: "Foreign participation in telecom services"
    definition: >
      Whether foreign operators may provide telecom services with limited or no
      equity restrictions and on a non-discriminatory licensing basis.
    evaluation_method: "clause_extraction"
    clause_pattern: "conditional_regime"
    scoring_criteria:
      "0": "Foreign operators barred or capped below 25%."
      "0.5": "Foreign equity capped between 25–74% or sectoral restrictions."
      "1": "Foreign equity unrestricted or capped only at majority threshold for strategic infrastructure."
    positive_keywords:
      en: ["foreign operator", "foreign equity", "licence to provide telecommunications",
           "market access"]
      fr: ["opérateur étranger", "participation étrangère", "licence pour fournir des services de télécommunications",
           "accès au marché"]
      es: ["operador extranjero", "capital extranjero", "licencia para prestar servicios de telecomunicaciones",
           "acceso al mercado"]
      zh: ["外国运营商", "外资股权", "提供电信服务的许可",
           "市场准入"]
    authority_hints: ["tier_1_statute", "tier_2_regulation"]
