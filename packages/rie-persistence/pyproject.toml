[project]
name = "rie-persistence"
version = "0.1.0"
description = "Postgres schema + repositories + Alembic migrations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rie-contracts",
    "sqlalchemy>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rie_persistence"]
