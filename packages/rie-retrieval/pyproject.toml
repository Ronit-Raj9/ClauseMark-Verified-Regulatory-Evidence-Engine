[project]
name = "rie-retrieval"
version = "0.1.0"
description = "BGE-M3 embeddings + Qdrant hybrid + RRF + cross-encoder reranker + parent-doc."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rie-contracts",
    "pydantic>=2.9",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "numpy>=1.26",
    "langdetect>=1.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rie_retrieval"]
