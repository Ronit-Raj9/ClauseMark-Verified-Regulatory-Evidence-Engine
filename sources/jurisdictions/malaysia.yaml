discovery:
  seed_urls:
    - "https://www.pdp.gov.my/"
    - "https://www.hasil.gov.my/en/legislation/act/"
    - "https://ccid.rmp.gov.my/"
    - "https://www.kkd.gov.my/"
  crawl_patterns:
    link_regexes:
      - "/(akta|act|legislation|code-of-practice)/"
      - "\\.pdf$"
    mime_allow:
      - "application/pdf"
      - "text/html"
  depth_limit: 2
  crawl_delay_seconds: 1.0
  max_pages: 200
