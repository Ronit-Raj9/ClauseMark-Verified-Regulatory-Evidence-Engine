[project]
name = "rie-orchestration"
version = "0.1.0"
description = "LangGraph wiring across all stages. Lead-owned."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rie-contracts",
    "rie-config",
    "rie-profiles",
    "rie-ingest",
    "rie-extract",
    "rie-retrieval",
    "rie-classify",
    "rie-verify",
    "rie-coverage",
    "rie-persistence",
    "rie-domain",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rie_orchestration"]
