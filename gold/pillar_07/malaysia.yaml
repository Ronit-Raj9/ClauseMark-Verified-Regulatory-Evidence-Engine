# RDTII 2.1 Round-1 gold — Malaysia, Pillar 7 (Domestic data protection &
# privacy). Source: ESCAP-RDTII-2.1_ Round 1 Database.xlsx (Malaysia sheet).
# 16 provisions (14 with explicit Indicator_ID + R50/R51 blank-indicator = 7.1).
# doc_id == source_id in sources/jurisdictions/malaysia.yaml. 7.1/7.2 INVERTED.
items:
  - gold_id: "p07_my_7_1_pdpa"
    pillar_id: "7"
    indicator_id: "7.1"
    jurisdiction: "Malaysia"
    doc_id: "my_pdpa_2010"
    span_text: >
      The Personal Data Protection Act 2010 provides a comprehensive
      data-protection framework for commercial transactions; the 2024 amendments
      add mandatory breach notification, processor obligations and increased
      penalties.
    expected_clause_pattern: "obligation"
    expected_score_band: "0"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Personal Data Protection Act 2010 (Act 709); Personal Data
      Protection (Amendment) Act 2024 (Act A1727). source_url:
      https://www.pdp.gov.my ; https://f.datasrvr.com/fr1/224/81715/DR_21_BI.pdf .
      coverage: Horizontal. INVERTED: comprehensive framework exists -> 0.

  - gold_id: "p07_my_7_1_banking_code"
    pillar_id: "7"
    indicator_id: "7.1"
    jurisdiction: "Malaysia"
    doc_id: "my_pdp_code_banking_2017"
    span_text: >
      The Code sets out collection with consent, security, retention and disposal,
      access and correction, third-party sharing and breach reporting for the
      banking and financial sector.
    expected_clause_pattern: "obligation"
    expected_score_band: "0.5"
    expected_authority_tier: "tier_3_guideline"
    notes: >
      law_name: Personal Data Protection Code of Practice for the Banking and
      Financial Sector 2017 (Round-1 row R50, blank Indicator_ID = 7.1).
      source_url: https://www.pdp.gov.my/ppdpv1/en/akta/personal-data-protection-code-of-practice-for-banking-sector-and-financial-institutions/ .
      coverage: Financial service (Sectoral). INVERTED: sectoral-only -> 0.5.

  - gold_id: "p07_my_7_1_communications_code"
    pillar_id: "7"
    indicator_id: "7.1"
    jurisdiction: "Malaysia"
    doc_id: "my_pdp_code_communications_2017"
    span_text: >
      The Code covers notice and choice, limitation of use, security, retention,
      access and accuracy, domestic transfers, cross-border restrictions and
      breach notice for licensees in the communications sector.
    expected_clause_pattern: "obligation"
    expected_score_band: "0.5"
    expected_authority_tier: "tier_3_guideline"
    notes: >
      law_name: Personal Data Protection Code of Practice for Licensees under the
      Communications and Multimedia Act 1998, 2017 (Round-1 row R51, blank
      Indicator_ID = 7.1). source_url:
      https://www.pdp.gov.my/ppdpv1/en/akta/personal-data-protection-code-of-practice-for-the-communications-sector/ .
      coverage: Horizontal/communications. INVERTED: sectoral code -> 0.5.

  - gold_id: "p07_my_7_2_cyber_security_act"
    pillar_id: "7"
    indicator_id: "7.2"
    jurisdiction: "Malaysia"
    doc_id: "my_cyber_security_act_2024"
    span_text: >
      The Cyber Security Act 2024 is a comprehensive framework establishing the
      National Cyber Security Committee, duties for national critical information
      infrastructure, licensing of cybersecurity service providers and
      enforcement.
    expected_clause_pattern: "obligation"
    expected_score_band: "0"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Cyber Security Act 2024 (Act 854) (ss.15-24, 27-34, 36-52);
      Computer Crimes Act 1997 (Act 563). source_url:
      https://lokekinggoh.com/layout2/wp-content/uploads/2024/06/Act-854.pdf ;
      https://ccid.rmp.gov.my/Laws/Computer_Crime_Act_1997.pdf . coverage:
      Horizontal. INVERTED: dedicated horizontal cyber framework exists -> 0.

  - gold_id: "p07_my_7_3_pdpa_standard"
    pillar_id: "7"
    indicator_id: "7.3"
    jurisdiction: "Malaysia"
    doc_id: "my_pdpa_2010"
    span_text: >
      Under the Retention Principle and the Personal Data Protection Standard
      2015, collection forms must be disposed of within 14 days and inactive data
      is subject to a 24-month disposal schedule.
    expected_clause_pattern: "obligation"
    expected_score_band: "1"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Personal Data Protection Act 2010 (Act 709); Personal Data
      Protection (Amendment) Act 2024 (Act A1727); Personal Data Protection
      Standard 2015. source_url: https://www.pdp.gov.my ;
      https://www.viatris.com/-/media/project/common/viatris/pdf/malaysia/malaysian-personal-data-protection-act-updated-2015.pdf .
      coverage: Horizontal. Minimum-period retention requirement -> 1.

  - gold_id: "p07_my_7_3_communications_code"
    pillar_id: "7"
    indicator_id: "7.3"
    jurisdiction: "Malaysia"
    doc_id: "my_pdp_code_communications_2017"
    span_text: >
      Licensees shall keep personal data only as long as necessary and securely
      destroy it after the purpose is fulfilled.
    expected_clause_pattern: "obligation"
    expected_score_band: "1"
    expected_authority_tier: "tier_3_guideline"
    notes: >
      law_name: Personal Data Protection Code of Practice for Licensees under the
      Communications and Multimedia Act 1998, 2017, ss.5.5 / 5.0. source_url:
      https://www.pdp.gov.my/ppdpv1/en/akta/personal-data-protection-code-of-practice-for-the-communications-sector/ .
      coverage: Communications Sector (Sectoral). Round-1 score 1.

  - gold_id: "p07_my_7_3_banking_code"
    pillar_id: "7"
    indicator_id: "7.3"
    jurisdiction: "Malaysia"
    doc_id: "my_pdp_code_banking_2017"
    span_text: >
      Banking personal data is retained for 7 years from account closure and
      destroyed after the purpose is fulfilled.
    expected_clause_pattern: "obligation"
    expected_score_band: "0"
    expected_authority_tier: "tier_3_guideline"
    notes: >
      law_name: Personal Data Protection Code of Practice for the Banking and
      Financial Sector 2017, ss.3.5 / 3.5.4 / 3.5.5 / 3.5.9. source_url:
      https://www.pdp.gov.my/ppdpv1/en/akta/personal-data-protection-code-of-practice-for-banking-sector-and-financial-institutions/ .
      coverage: Financial service (Sectoral). Round-1 score 0 (disposal-after-
      purpose framing).

  - gold_id: "p07_my_7_3_service_tax_act"
    pillar_id: "7"
    indicator_id: "7.3"
    jurisdiction: "Malaysia"
    doc_id: "my_service_tax_act_2018"
    span_text: >
      Records shall be preserved for 7 years and retained in Malaysia.
    expected_clause_pattern: "obligation"
    expected_score_band: "1"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Service Tax Act 2018 (Act 807), s.24. source_url:
      https://www.investmalaysia.gov.my . coverage: Service tax records
      (Sectoral). Minimum 7-year retention -> 1.

  - gold_id: "p07_my_7_3_income_tax_act"
    pillar_id: "7"
    indicator_id: "7.3"
    jurisdiction: "Malaysia"
    doc_id: "my_income_tax_act_1967"
    span_text: >
      A person shall keep and retain records for at least 7 years, retained in
      Malaysia.
    expected_clause_pattern: "obligation"
    expected_score_band: "1"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Income Tax Act 1967 (Act 53), s.82. source_url:
      https://www.hasil.gov.my/en/legislation/act/ . coverage: Income tax records
      (Sectoral). Minimum 7-year retention -> 1.

  - gold_id: "p07_my_7_4_pdpa_amendment"
    pillar_id: "7"
    indicator_id: "7.4"
    jurisdiction: "Malaysia"
    doc_id: "my_pdpa_amendment_2024"
    span_text: >
      The 2024 amendment mandates the appointment of a data protection officer
      across all sectors, and a data protection impact assessment is required for
      high-risk processing.
    expected_clause_pattern: "obligation"
    expected_score_band: "1"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Personal Data Protection (Amendment) Act 2024 (Act A1727),
      s.12A(1); Personal Data Protection Act 2010 (Act 709). source_url:
      https://www.pdp.gov.my/ppdpv1/akta/akta-pdppindaan-2024/ ;
      https://f.datasrvr.com/fr1/224/81715/DR_21_BI.pdf . coverage: Horizontal.
      Mandatory DPO across all sectors -> 1.

  - gold_id: "p07_my_7_5_pdpa"
    pillar_id: "7"
    indicator_id: "7.5"
    jurisdiction: "Malaysia"
    doc_id: "my_pdpa_2010"
    span_text: >
      The Personal Data Protection Act 2010 contains no explicit provision for
      government access to personal data without a court order; access powers rest
      on investigation exemptions, warrants under s.113, and search without
      warrant under s.114 where delay would be harmful.
    expected_clause_pattern: "exemption"
    expected_score_band: "0"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Personal Data Protection Act 2010 (Act 709), ss.45(2)(a)(i), 121,
      112, 113, 114; Personal Data Protection (Amendment) Act 2024 (Act A1727).
      source_url: https://www.pdp.gov.my . coverage: Horizontal. Round-1 PDPA row
      scored 0 (reviewer dissent recorded; Layer-2 human-confirmation territory).

  - gold_id: "p07_my_7_5_communications_code"
    pillar_id: "7"
    indicator_id: "7.5"
    jurisdiction: "Malaysia"
    doc_id: "my_pdp_code_communications_2017"
    span_text: >
      Personal data may be accessed when processed for the apprehension or
      prosecution of offenders or for tax assessment.
    expected_clause_pattern: "exemption"
    expected_score_band: "1"
    expected_authority_tier: "tier_3_guideline"
    notes: >
      law_name: Personal Data Protection Code of Practice for Licensees under the
      Communications and Multimedia Act 1998, 2017, s.7.4. source_url:
      https://www.pdp.gov.my/ppdpv1/en/akta/personal-data-protection-code-of-practice-for-the-communications-sector/ .
      coverage: Communications Sector (Sectoral). Access without judicial
      order -> 1.

