[project]
name = "rie-config"
version = "0.1.0"
description = "Loads + validates pillars/, sources/, gold/."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rie-contracts",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23",
    "referencing>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rie_config"]
