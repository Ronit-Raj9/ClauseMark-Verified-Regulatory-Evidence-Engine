[project]
name = "regulatory-intelligence-engine"
version = "0.1.0"
description = "Evidence-extraction and verification engine for RDTII digital-governance indicators."
requires-python = ">=3.12,<3.13"
readme = "README.md"

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/rie-ui-web"]

[tool.uv.sources]
rie-contracts = { workspace = true }
rie-domain = { workspace = true }
rie-config = { workspace = true }
rie-profiles = { workspace = true }
rie-ingest = { workspace = true }
rie-extract = { workspace = true }
rie-retrieval = { workspace = true }
rie-classify = { workspace = true }
rie-verify = { workspace = true }
rie-coverage = { workspace = true }
rie-output = { workspace = true }
rie-orchestration = { workspace = true }
rie-persistence = { workspace = true }
rie-api = { workspace = true }
rie-ui = { workspace = true }
rie-eval = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pyright>=1.1.380",
    "pre-commit>=4.0",
    "httpx>=0.27",
    "respx>=0.21",
    "freezegun>=1.5",
    "pandas>=3.0.3",
    "openpyxl>=3.1.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: end-to-end tests touching external services",
    "slow: tests that take >5s",
]
