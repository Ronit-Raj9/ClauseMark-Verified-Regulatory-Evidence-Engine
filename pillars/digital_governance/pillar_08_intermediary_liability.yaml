pillar_id: "8"
pillar_name: "Internet intermediary liability"
cluster: "digital_governance"
document_profile: "statutory_legal_text"
status: "stub"
description: >
  Liability regime for online intermediaries (hosts, conduits, search) for
  third-party content; safe harbours; notice-and-action duties.

indicators:
  - indicator_id: "8.1"
    name: "Conditional intermediary safe harbour"
    definition: "Whether the law grants intermediaries conditional immunity for user content."
    evaluation_method: "clause_extraction"
    clause_pattern: "conditional_regime"
    scoring_criteria:
      "0": "No safe harbour; strict liability."
      "0.5": "Narrow / sectoral safe harbour."
      "1": "General conditional safe harbour."
    positive_keywords:
      en: ["safe harbour", "mere conduit", "shall not be liable", "notice and takedown"]
    authority_hints: ["tier_1_statute", "tier_2_regulation"]

  - indicator_id: "8.2"
    name: "Notice-and-action procedure"
    definition: "Whether the law defines a notice-and-action procedure for unlawful content."
    evaluation_method: "clause_extraction"
    clause_pattern: "obligation"
    scoring_criteria:
      "0": "No procedure defined."
      "0.5": "Procedure exists but lacks counter-notice or appeal."
      "1": "Procedure includes counter-notice / appeal."
    positive_keywords:
      en: ["notice", "expeditiously remove", "counter-notice", "takedown"]
    authority_hints: ["tier_1_statute"]
