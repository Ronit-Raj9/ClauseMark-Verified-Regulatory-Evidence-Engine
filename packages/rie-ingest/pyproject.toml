[project]
name = "rie-ingest"
version = "0.1.0"
description = "Sample-law loader, source-registry parser, provenance capture."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rie-contracts",
    "rie-config",
    "pydantic>=2.9",
    "httpx>=0.27",
    "tenacity>=9.1.4",
    "pyyaml>=6.0",
]

[project.scripts]
rie-discovery = "rie_ingest.discovery:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rie_ingest"]
