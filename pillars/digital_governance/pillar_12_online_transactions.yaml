pillar_id: "12"
pillar_name: "Online transactions and e-commerce"
cluster: "digital_governance"
document_profile: "statutory_legal_text"
status: "built"
description: >
  Legal recognition of electronic signatures and contracts, online consumer
  protection, and membership in core UNCITRAL / UN instruments (MLEC, MLES,
  e-Communications Convention).

indicators:
  - indicator_id: "12.1"
    name: "Electronic signature recognition"
    definition: >
      Whether electronic signatures have legal recognition equivalent to
      handwritten signatures for the formation and execution of contracts.
    evaluation_method: "clause_extraction"
    clause_pattern: "obligation"
    scoring_criteria:
      "0": "No legal recognition."
      "0.5": "Recognition limited to specified contexts or qualified signatures only."
      "1": "General functional-equivalence recognition for electronic signatures."
    positive_keywords:
      en: ["electronic signature", "digital signature", "shall not be denied legal effect",
           "functional equivalent", "advanced electronic signature"]
    negative_cues:
      en: ["wet signature required", "handwritten signature is mandatory"]
    authority_hints: ["tier_1_statute"]

  - indicator_id: "12.2"
    name: "Online consumer protection"
    definition: >
      Whether the law provides specific consumer protections for online
      transactions (pre-contract information, right of withdrawal, recourse).
    evaluation_method: "clause_extraction"
    clause_pattern: "obligation"
    scoring_criteria:
      "0": "No online-specific consumer protection."
      "0.5": "Partial protections (e.g. pre-contract disclosure only)."
      "1": "Full set: disclosure, withdrawal / cooling-off, redress mechanism."
    positive_keywords:
      en: ["right to withdraw", "cooling-off period", "pre-contract information",
           "consumer protection", "distance selling", "online consumer"]
    negative_cues:
      en: ["does not apply to electronic transactions"]
    authority_hints: ["tier_1_statute", "tier_2_regulation"]

  - indicator_id: "12.3"
    name: "Electronic contract validity"
    definition: >
      Whether contracts concluded by electronic means are recognised as valid
      and enforceable on the same footing as paper contracts.
    evaluation_method: "clause_extraction"
    clause_pattern: "obligation"
    scoring_criteria:
      "0": "Electronic contracts not enforceable."
      "0.5": "Enforceable subject to formalities (e.g. specified categories excluded)."
      "1": "Generally enforceable; functional equivalence applied."
    positive_keywords:
      en: ["electronic contract", "by electronic means", "data message",
           "shall not be denied validity", "writing requirement is met"]
    negative_cues:
      en: ["paper original required", "void if concluded electronically"]
    authority_hints: ["tier_1_statute"]

  - indicator_id: "12.4"
    name: "Spam / unsolicited commercial communications regulation"
    definition: >
      Whether unsolicited commercial electronic communications are regulated
      (opt-in, opt-out, sender identification, complaints regime).
    evaluation_method: "clause_extraction"
    clause_pattern: "obligation"
    scoring_criteria:
      "0": "No regulation."
      "0.5": "Opt-out regime only."
      "1": "Opt-in (prior consent) regime with sender identification and enforcement."
    positive_keywords:
      en: ["unsolicited commercial", "spam", "prior consent", "opt-in", "opt-out",
           "unsubscribe", "electronic marketing"]
    authority_hints: ["tier_1_statute", "tier_2_regulation"]

  - indicator_id: "12.10"
    name: "UNCITRAL Model Law on Electronic Commerce (MLEC) adoption"
    definition: >
      Whether the jurisdiction has enacted legislation based on the UNCITRAL
      Model Law on Electronic Commerce (1996).
    evaluation_method: "treaty_lookup"
    scoring_criteria:
      "0": "Not adopted."
      "1": "Adopted (legislation based on MLEC enacted)."
    authority_hints: ["tier_1_statute"]

  - indicator_id: "12.11"
    name: "UNCITRAL Model Law on Electronic Signatures (MLES) adoption"
    definition: >
      Whether the jurisdiction has enacted legislation based on the UNCITRAL
      Model Law on Electronic Signatures (2001).
    evaluation_method: "treaty_lookup"
    scoring_criteria:
      "0": "Not adopted."
      "1": "Adopted (legislation based on MLES enacted)."
    authority_hints: ["tier_1_statute"]

  - indicator_id: "12.12"
    name: "UN Convention on Electronic Communications (ECC) membership"
    definition: >
      Whether the jurisdiction is a party to the United Nations Convention on
      the Use of Electronic Communications in International Contracts (2005).
    evaluation_method: "treaty_lookup"
    scoring_criteria:
      "0": "Not a party."
      "1": "Party to the Convention."
    authority_hints: ["tier_1_statute"]

  - indicator_id: "12.13"
    name: "UNCITRAL Model Law on Electronic Transferable Records (MLETR) adoption"
    definition: >
      Whether the jurisdiction has enacted legislation based on the UNCITRAL
      Model Law on Electronic Transferable Records (2017).
    evaluation_method: "treaty_lookup"
    scoring_criteria:
      "0": "Not adopted."
      "1": "Adopted (legislation based on MLETR enacted)."
    authority_hints: ["tier_1_statute"]
