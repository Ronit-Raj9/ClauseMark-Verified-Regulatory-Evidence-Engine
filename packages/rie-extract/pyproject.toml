[project]
name = "rie-extract"
version = "0.1.0"
description = "Docling/PyMuPDF/VLM-OCR routing, OCR-error handling, structure graph."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rie-contracts",
    "rie-profiles",
    "pydantic>=2.9",
    "pymupdf>=1.24",
    "docling>=2.10",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rie_extract"]
