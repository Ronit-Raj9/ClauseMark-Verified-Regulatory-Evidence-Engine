# RDTII 2.1 Round-1 gold — Malaysia, Pillar 6 (Cross-border data policies).
# Source: ESCAP-RDTII-2.1_ Round 1 Database.xlsx (Malaysia sheet). 10 scored
# provisions (one indicator -> many laws). doc_id == source_id in
# sources/jurisdictions/malaysia.yaml. Score convention: 0 = open, 1 = restrictive.
items:
  - gold_id: "p06_my_6_1_pdpa"
    pillar_id: "6"
    indicator_id: "6.1"
    jurisdiction: "Malaysia"
    doc_id: "my_pdpa_2010"
    span_text: >
      A data user shall not transfer any personal data of a data subject to a
      place outside Malaysia unless to such place as specified by the Minister, by
      notification published in the Gazette; the Act prohibits transfer to
      non-gazetted places but provides consent and contract exceptions and does
      not mandate local processing.
    expected_clause_pattern: "prohibition"
    expected_score_band: "0"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Personal Data Protection Act 2010 (Act 709), s.129; Personal Data
      Protection (Amendment) Act 2024 (Act A1727); PDP Code of Practice for the
      Banking and Financial Sector 2017. source_url:
      https://www.pdp.gov.my ; https://f.datasrvr.com/fr1/224/81715/DR_21_BI.pdf .
      coverage: Horizontal. No outright transfer ban / local-processing mandate
      (s.129 is conditional) -> 0.

  - gold_id: "p06_my_6_2_pdpa"
    pillar_id: "6"
    indicator_id: "6.2"
    jurisdiction: "Malaysia"
    doc_id: "my_pdpa_2010"
    span_text: >
      There is no strict data-localisation law; the Personal Data Protection Act
      2010 regulates cross-border transfer but imposes no blanket local-storage
      mandate.
    expected_clause_pattern: "obligation"
    expected_score_band: "0"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Personal Data Protection Act 2010 (Act 709); Personal Data
      Protection (Amendment) Act 2024 (Act A1727); PDP Code of Practice for the
      Banking and Financial Sector 2017. source_url: https://www.pdp.gov.my .
      coverage: Horizontal. No local-storage mandate -> 0.

  - gold_id: "p06_my_6_2_banking_code"
    pillar_id: "6"
    indicator_id: "6.2"
    jurisdiction: "Malaysia"
    doc_id: "my_pdp_code_banking_2017"
    span_text: >
      Under the Security Principle, personal data should be processed with consent
      and stored locally in secure systems.
    expected_clause_pattern: "obligation"
    expected_score_band: "0"
    expected_authority_tier: "tier_3_guideline"
    notes: >
      law_name: Personal Data Protection Code of Practice for the Banking and
      Financial Sector 2017, ss.3.1.1 / 3.1.4. source_url:
      https://www.pdp.gov.my/ppdpv1/en/akta/personal-data-protection-code-of-practice-for-banking-sector-and-financial-institutions/ .
      coverage: Financial service (Sectoral). Local processing preferable but no
      blanket mandate -> 0.

  - gold_id: "p06_my_6_2_communications_code"
    pillar_id: "6"
    indicator_id: "6.2"
    jurisdiction: "Malaysia"
    doc_id: "my_pdp_code_communications_2017"
    span_text: >
      Licensees should process personal data within Malaysia with consent and
      hold it in secure systems, including local storage.
    expected_clause_pattern: "obligation"
    expected_score_band: "0"
    expected_authority_tier: "tier_3_guideline"
    notes: >
      law_name: Personal Data Protection Code of Practice for Licensees under the
      Communications and Multimedia Act 1998, 2017, ss.3.1 / 3.4. source_url:
      https://www.pdp.gov.my/ppdpv1/en/akta/personal-data-protection-code-of-practice-for-the-communications-sector/ .
      coverage: Horizontal/communications. No blanket local-storage mandate -> 0.

  - gold_id: "p06_my_6_2_service_tax_act"
    pillar_id: "6"
    indicator_id: "6.2"
    jurisdiction: "Malaysia"
    doc_id: "my_service_tax_act_2018"
    span_text: >
      A taxable person must keep records for 7 years, in the national language or
      English, and the records shall be retained in Malaysia unless the
      Director General otherwise approves.
    expected_clause_pattern: "obligation"
    expected_score_band: "0.5"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Service Tax Act 2018 (Act 807), s.24. source_url:
      https://www.investmalaysia.gov.my . coverage: Service tax records
      (Sectoral). Sectoral local-storage requirement -> 0.5.

  - gold_id: "p06_my_6_2_income_tax_act"
    pillar_id: "6"
    indicator_id: "6.2"
    jurisdiction: "Malaysia"
    doc_id: "my_income_tax_act_1967"
    span_text: >
      All records relating to a business in Malaysia shall be kept and retained in
      Malaysia, including books of account, invoices, vouchers and receipts, for
      at least 7 years.
    expected_clause_pattern: "obligation"
    expected_score_band: "0.5"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Income Tax Act 1967 (Act 53), s.82. source_url:
      https://www.hasil.gov.my/en/legislation/act/ . coverage: Income tax records
      (Sectoral). Sectoral local-storage requirement -> 0.5.

  - gold_id: "p06_my_6_3_pdpa"
    pillar_id: "6"
    indicator_id: "6.3"
    jurisdiction: "Malaysia"
    doc_id: "my_pdpa_2010"
    span_text: >
      There is no explicit broad data-localisation or own-data-centre requirement;
      sectoral conditions encourage local processing but none mandate local
      infrastructure.
    expected_clause_pattern: "obligation"
    expected_score_band: "0"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Personal Data Protection Act 2010 (Act 709); PDP Code of Practice
      for Licensees under the Communications and Multimedia Act 1998, 2017.
      source_url: https://www.pdp.gov.my . coverage: Horizontal. No infrastructure
      requirement -> 0.

  - gold_id: "p06_my_6_4_pdpa"
    pillar_id: "6"
    indicator_id: "6.4"
    jurisdiction: "Malaysia"
    doc_id: "my_pdpa_2010"
    span_text: >
      A data user may transfer personal data to a place outside Malaysia only
      under listed conditions, including the consent of the data subject, the
      performance of a contract, the exercise of a legal right, or vital or public
      interest; the 2024 amendments add an adequacy assessment of the recipient
      country.
    expected_clause_pattern: "conditional_regime"
    expected_score_band: "1"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Personal Data Protection Act 2010 (Act 709), s.129; Personal Data
      Protection (Amendment) Act 2024 (Act A1727). source_url:
      https://www.pdp.gov.my/ppdpv1/akta/akta-pdppindaan-2024/ . coverage:
      Horizontal. Conditional flow regime over personal data -> 1.

  - gold_id: "p06_my_6_4_banking_code"
    pillar_id: "6"
    indicator_id: "6.4"
    jurisdiction: "Malaysia"
    doc_id: "my_pdp_code_banking_2017"
    span_text: >
      Cross-border transfer must comply with the Personal Data Protection Act and
      with written agreements, and transfer abroad is prohibited unless there is
      adequate protection, the place is gazetted, or the data subject consents.
    expected_clause_pattern: "conditional_regime"
    expected_score_band: "1"
    expected_authority_tier: "tier_3_guideline"
    notes: >
      law_name: Personal Data Protection Code of Practice for the Banking and
      Financial Sector 2017, Schedule 1 s.1.1 / s.4.10. source_url:
      https://www.pdp.gov.my/ppdpv1/en/akta/personal-data-protection-code-of-practice-for-banking-sector-and-financial-institutions/ .
      coverage: Financial service (Sectoral). Conditional flow over personal
      data -> 1.

  - gold_id: "p06_my_6_4_communications_code"
    pillar_id: "6"
    indicator_id: "6.4"
    jurisdiction: "Malaysia"
    doc_id: "my_pdp_code_communications_2017"
    span_text: >
      Licensees may not transfer personal data abroad unless there is adequate
      protection or the data subject consents, and third-party providers must
      comply with the same standards.
    expected_clause_pattern: "conditional_regime"
    expected_score_band: "1"
    expected_authority_tier: "tier_3_guideline"
    notes: >
      law_name: Personal Data Protection Code of Practice for Licensees under the
      Communications and Multimedia Act 1998, 2017, ss.4.7 / 3.2(ii). source_url:
      https://www.pdp.gov.my/ppdpv1/en/akta/personal-data-protection-code-of-practice-for-the-communications-sector/ .
      coverage: Horizontal/communications. Conditional flow over personal
      data -> 1.
