[project]
name = "rie-verify"
version = "0.1.0"
description = "4-gate verification + ID-replacement citations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rie-contracts",
    "pydantic>=2.9",
    "httpx>=0.27",
    "sentence-transformers>=5.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rie_verify"]
