[project]
name = "rie-api"
version = "0.1.0"
description = "FastAPI driver."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rie-contracts",
    "rie-orchestration",
    "rie-persistence",
    "rie-config",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rie_api"]
