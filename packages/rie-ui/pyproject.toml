[project]
name = "rie-ui"
version = "0.1.0"
description = "Streamlit audit viewer."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rie-contracts",
    "streamlit>=1.40",
    "httpx>=0.27",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rie_ui"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "respx>=0.23.1",
]
