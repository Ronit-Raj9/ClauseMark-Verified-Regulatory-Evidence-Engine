      coverage: Financial service (Sectoral). Access without judicial order -> 1.

  - gold_id: "p07_my_7_5_cyber_security_act"
    pillar_id: "7"
    indicator_id: "7.5"
    jurisdiction: "Malaysia"
    doc_id: "my_cyber_security_act_2024"
    span_text: >
      The Cyber Security Act 2024 permits access to computerised data on search,
      provides investigation powers and warrants, and allows search and seizure
      without a warrant where delay would be harmful.
    expected_clause_pattern: "obligation"
    expected_score_band: "1"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Cyber Security Act 2024 (Act 854), ss.46, 38, 39, 40. source_url:
      https://lokekinggoh.com/layout2/wp-content/uploads/2024/06/Act-854.pdf .
      coverage: Horizontal. Search without warrant where delay harmful -> 1.

  - gold_id: "p07_my_7_5_sosma"
    pillar_id: "7"
    indicator_id: "7.5"
    jurisdiction: "Malaysia"
    doc_id: "my_sosma_2012"
    span_text: >
      A police officer of or above the rank of superintendent may intercept
      communications without the authorisation of the Public Prosecutor in urgent
      cases.
    expected_clause_pattern: "obligation"
    expected_score_band: "1"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Security Offences (Special Measures) Act 2012 (Act 747), s.6(3).
      source_url: https://cyrilla.org/api/files/1568729125117t97ha9lu92p.pdf .
      coverage: Horizontal. Interception without prosecutor authorisation -> 1.

  - gold_id: "p07_my_7_5_criminal_procedure_code"
    pillar_id: "7"
    indicator_id: "7.5"
    jurisdiction: "Malaysia"
    doc_id: "my_criminal_procedure_code"
    span_text: >
      A police officer may be given access to computerised data on search,
      including the password or means of decryption, and the Public Prosecutor may
      authorise interception of communications.
    expected_clause_pattern: "obligation"
    expected_score_band: "1"
    expected_authority_tier: "tier_1_statute"
    notes: >
      law_name: Criminal Procedure Code (Act 593), ss.116B / 116C. source_url:
      https://cyrilla.org/api/files/1568727997327dm3cpb84eaw.pdf . coverage:
      Horizontal. Access / interception powers -> 1.
