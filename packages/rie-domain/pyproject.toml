[project]
name = "rie-domain"
version = "0.1.0"
description = "Pure business logic. Lead-owned. Imports only rie-contracts."
requires-python = ">=3.12,<3.13"
dependencies = ["rie-contracts", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rie_domain"]
